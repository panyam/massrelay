name: Publish npm

# Publishes ts/ as @panyam/massrelay when a release tag is pushed. The tag must
# match ts/package.json's version, so a Go-only tag that forgot to bump the TS
# package fails here instead of publishing the wrong thing. Run it by hand
# (workflow_dispatch, ref = an existing tag) to publish a tag pushed before
# this workflow existed, e.g. v0.2.1.
#
# Needs the NPM_TOKEN repository secret: an npm automation token with publish
# rights on @panyam/massrelay.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Check the tag matches ts/package.json
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(node -p "require('./package.json').version")"
          if [ "$want" != "$have" ]; then
            echo "tag ${GITHUB_REF_NAME} but ts/package.json is ${have}" >&2
            exit 1
          fi
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run test:interop
      - name: Publish, unless this version is already on npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          v="$(node -p "require('./package.json').version")"
          if npm view "@panyam/massrelay@${v}" version >/dev/null 2>&1; then
            echo "@panyam/massrelay@${v} is already published"
            exit 0
          fi
          npm publish --provenance --access public
