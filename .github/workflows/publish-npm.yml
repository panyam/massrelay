name: Publish npm

# Publishes ts/ as @panyam/massrelay when a release tag is pushed, through
# servicekit's shared workflow, which uses npm trusted publishing (no token).
# The Go module and the TS package share one version (CAPABILITIES.md's
# "## Version"), and scripts/check-versions.sh fails the run when the tag,
# CAPABILITIES.md or ts/package.json disagree. Run it by
# hand (workflow_dispatch, ref = an existing tag) to publish an older tag.
#
# npm side, once:
#   npm trust github @panyam/massrelay --repo panyam/massrelay --file publish-npm.yml --allow-publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: ../scripts/check-versions.sh "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run test:interop

  publish:
    needs: test
    uses: panyam/servicekit/.github/workflows/npm-publish.yml@master
    with:
      working-directory: ts
